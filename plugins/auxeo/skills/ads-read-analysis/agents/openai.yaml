interface:
  display_name: "Ads · 分析与决策"
  short_description: "查证广告事实、诊断原因并形成有边界的行动候选"
  default_prompt: "使用 $ads-read-analysis 通过 Ads Read MCP 分析 Meta、Google Ads、TikTok Ads 或 AppsFlyer 问题；核对支持、反证、缺失证据与行动边界，不调用旧策略 runtime。"

dependencies:
  tools:
    - type: "mcp"
      value: "ads_read"
      description: "Ads Read MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
